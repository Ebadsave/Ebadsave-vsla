name: Cloudflare D1 Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-migrations:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Cloudflare-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Cloudflare-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Verify migration files
        run: |
          set -eu
          for migration in \
            0001_initial.sql \
            0002_authentication.sql \
            0003_remote_passbooks.sql \
            0004_group_passbook_summary.sql \
            0005_group_admin_bootstrap.sql \
            0006_remote_member_registrations.sql
          do
            test -f "migrations/$migration"
            echo "Found: $migration"
          done

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply pending migrations to remote D1
        run: npx wrangler d1 migrations apply ebadsave-vsla-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
