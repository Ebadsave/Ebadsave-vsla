name: Build Ebadsave VSLA Release APK

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: 1. Checkout
    uses: actions/checkout@v4

  - name: 2. Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: 3. Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: 4. Install dependencies
    run: |
      echo "========== NPM INSTALL =========="
      npm install
      npm install firebase

  - name: 5. Install Expo packages
    run: |
      echo "========== EXPO PACKAGES =========="
      npx expo install expo-crypto
      npx expo install expo-image-picker

  - name: 6. TypeScript check
    run: |
      echo "========== TYPESCRIPT =========="
      npx tsc --noEmit

  - name: 7. Check Expo configuration
    run: |
      echo "========== EXPO CONFIG =========="
      npx expo config --type public

  - name: 8. Generate Android project
    run: |
      echo "========== EXPO PREBUILD =========="
      npx expo prebuild --platform android --non-interactive

  - name: 9. Check application icon
    run: |
      echo "========== ICON CHECK =========="
      if [ ! -f "assets/icon/app_icon.png" ]; then
        echo "ERROR: Ebadsave icon was not found."
        exit 1
      fi

      file assets/icon/app_icon.png
      ls -lh assets/icon/app_icon.png

  - name: 10. Build RELEASE APK
    run: |
      echo "========== RELEASE BUILD =========="
      cd android
      ./gradlew assembleRelease --no-daemon --stacktrace

  - name: 11. Find RELEASE APK
    run: |
      echo "========== APK FILES =========="
      find android/app/build/outputs -type f -name "*.apk" -exec ls -lh {} \;

  - name: 12. Verify RELEASE APK
    run: |
      APK="android/app/build/outputs/apk/release/app-release.apk"

      if [ ! -f "$APK" ]; then
        echo "ERROR: Release APK was not created."
        echo ""
        echo "Available APK files:"
        find android/app/build/outputs -type f -name "*.apk" || true
        exit 1
      fi

      echo ""
      echo "========== RELEASE APK CREATED =========="
      ls -lh "$APK"

  - name: 13. Upload RELEASE APK
    uses: actions/upload-artifact@v4
    with:
      name: Ebadsave-vsla-release-apk
      path: android/app/build/outputs/apk/release/app-release.apk
      if-no-files-found: error
