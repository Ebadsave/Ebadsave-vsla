name: Ebadsave VSLA Build Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Show project files
        run: |
          echo "========== PROJECT =========="
          pwd
          echo ""
          echo "========== FILES =========="
          ls -la
          echo ""
          echo "========== PACKAGE.JSON =========="
          if [ -f package.json ]; then
            echo "package.json FOUND"
            cat package.json
          else
            echo "ERROR: package.json NOT FOUND"
            exit 1
          fi

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 4. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 5. Install dependencies
        run: |
          echo "========== NPM INSTALL =========="
          npm install

      - name: 6. Install Expo packages
        run: |
          echo "========== EXPO PACKAGES =========="
          npx expo install expo-crypto
          npx expo install expo-image-picker

      - name: 7. TypeScript check
        run: |
          echo "========== TYPESCRIPT CHECK =========="
          npx tsc --noEmit

      - name: 8. Expo prebuild
        run: |
          echo "========== EXPO PREBUILD =========="
          npx expo prebuild --platform android --non-interactive

      - name: 9. Check Android project
        run: |
          echo "========== ANDROID PROJECT =========="
          ls -la android
          echo ""
          echo "Gradle wrapper:"
          ls -la android/gradlew

      - name: 10. Build debug APK
        run: |
          echo "========== GRADLE BUILD =========="
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 11. Verify APK
        run: |
          echo "========== APK CHECK =========="

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK FOUND:"
          ls -lh "$APK"

      - name: 12. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ebadsave-vsla-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
