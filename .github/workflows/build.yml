name: Build Ebadsave VSLA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        run: |
          set +e
          cd android
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "========== BUILD ERROR SUMMARY =========="

          if [ "$BUILD_EXIT" -ne 0 ]; then
            grep -E \
              "FAILURE|What went wrong|Execution failed|Caused by:|Exception|Error:|Could not|BUILD FAILED|KeytoolException" \
              ../gradle-build.log | tail -100 || true

            echo ""
            echo "========== LAST 100 LOG LINES =========="
            tail -100 ../gradle-build.log

            exit "$BUILD_EXIT"
          fi

          echo "BUILD SUCCESSFUL"

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebadsave-vsla-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
