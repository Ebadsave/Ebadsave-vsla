name: Build Ebadsave VSLA Release APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Avoid android-actions/setup-android because the failed run is trying
      # to install the obsolete SDK package named "tools".
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found in $ANDROID_HOME/cmdline-tools."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install JavaScript dependencies
        run: |
          npm install
          npm install --no-save crypto-js @types/crypto-js
          npx expo install expo-crypto expo-secure-store

      - name: Install Expo packages
        run: npx expo install expo-crypto expo-image-picker expo-secure-store

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Check Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Check application icon
        run: |
          if [ ! -f assets/icon/app_icon.png ]; then
            echo "ERROR: Ebadsave icon was not found."
            exit 1
          fi

      - name: Build RELEASE APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK and check size
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            find android/app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          ls -lh "$APK"
          SIZE=$(stat -c%s "$APK")
          LIMIT=$((30 * 1024 * 1024))
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "WARNING: APK is 30 MiB or larger."
          else
            echo "SUCCESS: APK is smaller than 30 MiB."
          fi

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: Ebadsave-vsla-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
