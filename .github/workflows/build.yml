name: Ebadsave VSLA APK

on: [push]

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 20

  - run: npm install

  - run: npx expo install expo-crypto

  - run: npx expo install expo-image-picker

  - run: npx tsc --noEmit
