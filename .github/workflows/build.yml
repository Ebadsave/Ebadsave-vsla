name: Build Ebadsave VSLA APK

on: [push, workflow_dispatch]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install dependencies
    run: npm install

  - name: Install Expo packages
    run: |
      echo "Installing expo-crypto..."
      npx expo install expo-crypto

      echo ""
      echo "Installing expo-image-picker..."
      npx expo install expo-image-picker

      echo ""
      echo "Expo package installation completed."

  - name: TypeScript check
    run: |
      echo "Running TypeScript check..."
      npx tsc --noEmit
      echo "TypeScript check completed."

  - name: Generate Android project
    run: |
      echo "Generating Android project..."
      npx expo prebuild --platform android --non-interactive
      echo "Android project generated."

  - name: Build debug APK
    run: |
      echo "Starting Gradle build..."

      set +e

      cd android
      ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle-build.log

      BUILD_EXIT=${PIPESTATUS[0]}

      echo ""
      echo "Gradle exit code: $BUILD_EXIT"

      if [ "$BUILD_EXIT" -ne 0 ]; then
        echo ""
        echo "========== GRADLE FAILURE =========="
        grep -E "FAILURE|What went wrong|Execution failed|Caused by:|Exception|Error:|Could not|BUILD FAILED" ../gradle-build.log | tail -100 || true

        echo ""
        echo "========== LAST 100 GRADLE LINES =========="
        tail -100 ../gradle-build.log

        exit "$BUILD_EXIT"
      fi

      echo "BUILD SUCCESSFUL"

  - name: Verify APK
    run: |
      echo "Checking APK..."

      APK="android/app/build/outputs/apk/debug/app-debug.apk"

      if [ ! -f "$APK" ]; then
        echo "ERROR: APK was not created."
        find android -name "*.apk" -type f -print || true
        exit 1
      fi

      echo ""
      echo "========== APK CREATED =========="
      ls -lh "$APK"

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: ebadsave-vsla-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
