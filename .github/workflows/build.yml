name: Build Ebadsave VSLA APK

on: [push, workflow_dispatch]

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 20

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - run: npm install

  - run: npx expo install expo-crypto

  - run: npx expo install expo-image-picker

  - run: npx tsc --noEmit

  - run: npx expo prebuild --platform android --non-interactive

  - name: Build debug APK
    run: |
      set +e
      cd android
      ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle-build.log
      BUILD_EXIT=${PIPESTATUS[0]}
      set -e

      if [ "$BUILD_EXIT" -ne 0 ]; then
        echo "========== GRADLE ERROR =========="
        grep -E "FAILURE|What went wrong|Execution failed|Caused by:|Exception|Error:|Could not|BUILD FAILED" ../gradle-build.log | tail -100 || true
        echo "========== LAST 100 LINES =========="
        tail -100 ../gradle-build.log
        exit "$BUILD_EXIT"
      fi

      echo "BUILD SUCCESSFUL"

  - name: Verify APK
    run: |
      APK="android/app/build/outputs/apk/debug/app-debug.apk"

      if [ ! -f "$APK" ]; then
        echo "ERROR: APK was not created."
        exit 1
      fi

      echo "APK successfully created:"
      ls -lh "$APK"

  - uses: actions/upload-artifact@v4
    with:
      name: ebadsave-vsla-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
