name: Deploy Ebadsave Cloudflare Worker

on:
push:
branches:
- main
paths:
- "Cloudflare-worker/**"
- ".github/workflows/deploy-cloudflare-worker.yml"
workflow_dispatch:

permissions:
contents: read

jobs:
deploy:
runs-on: ubuntu-latest

defaults:
  run:
    working-directory: Cloudflare-worker

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Worker dependencies
    run: npm install

  - name: Type-check Worker
    run: npm run typecheck

  - name: Verify Cloudflare authentication
    run: npx wrangler whoami
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  - name: Set Cloudflare Secrets
    shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_BOOTSTRAP_SECRET: ${{ secrets.ADMIN_BOOTSTRAP_SECRET }}
      JWT_HS256_SECRET: ${{ secrets.JWT_HS256_SECRET }}
      PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
    run: |
      set -euo pipefail

      test -n "$ADMIN_BOOTSTRAP_SECRET"
      test -n "$JWT_HS256_SECRET"
      test -n "$PIN_PEPPER"

      printf '%s' "$ADMIN_BOOTSTRAP_SECRET" | npx wrangler secret put ADMIN_BOOTSTRAP_SECRET --name ebadsave-vsla-cloudflare
      printf '%s' "$JWT_HS256_SECRET" | npx wrangler secret put JWT_HS256_SECRET --name ebadsave-vsla-cloudflare
      printf '%s' "$PIN_PEPPER" | npx wrangler secret put PIN_PEPPER --name ebadsave-vsla-cloudflare

  - name: Deploy existing Ebadsave Worker
    uses: cloudflare/wrangler-action@v3
    with:
      apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      command: deploy --name ebadsave-vsla-cloudflare
      workingDirectory: Cloudflare-worker
