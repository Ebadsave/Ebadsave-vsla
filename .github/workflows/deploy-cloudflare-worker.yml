      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply ebadsave-vsla-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  name: Deploy Ebadsave Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "Cloudflare-worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Cloudflare-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Worker dependencies
        run: npm install

      - name: Type-check Worker
        run: npm run typecheck

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set Cloudflare Secrets
        run: |
          echo "${{ secrets.ADMIN_BOOTSTRAP_SECRET }}" | npx wrangler secret put ADMIN_BOOTSTRAP_SECRET --name ebadsave-vsla-cloudflare
          echo "${{ secrets.JWT_SH256_SECRET }}" | npx wrangler secret put JWT_SH256_SECRET --name ebadsave-vsla-cloudflare
          echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET --name ebadsave-vsla-cloudflare
          echo "${{ secrets.PIN_PEPPER }}" | npx wrangler secret put PIN_PEPPER --name ebadsave-vsla-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: List existing Worker secret names
        run: npx wrangler secret list --name ebadsave-vsla-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy existing Ebadsave Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name ebadsave-vsla-cloudflare
          workingDirectory: Cloudflare-worker
