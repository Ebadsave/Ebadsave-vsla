name: Check Ebadsave D1 Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-migrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check remote D1 migrations
        working-directory: Cloudflare-worker
        run: |
          npm install --no-save wrangler@4.86.0
          npx wrangler d1 migrations list ebadsave-vsla-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
