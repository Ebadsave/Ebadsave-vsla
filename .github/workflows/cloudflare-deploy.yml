name: Deploy Ebadsave Cloudflare Worker

'on':
  push:
    branches:
      - main
    paths:
      - 'Cloudflare-worker/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Cloudflare-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.86.0

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: GitHub Actions secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          npx wrangler whoami

      - name: Check D1 migration history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list ebadsave-vsla-db --remote

      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply ebadsave-vsla-db --remote

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy --name ebadsave-vsla-cloudflare

      - name: Verify deployed Worker responds
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            https://ebadsave-vsla-cloudflare.info-ebadsave.workers.dev/health)"
          echo "$RESPONSE"
          node -e '
            const data = JSON.parse(process.argv[1]);
            if (data.ok !== true || data.service !== "ebadsave-vsla-cloudflare") {
              console.error("ERROR: Health endpoint did not confirm the expected Worker.");
              process.exit(1);
            }
            console.log("Worker health endpoint responded successfully.");
          ' "$RESPONSE"
