name: Deploy Ebadsave Cloudflare Worker

'on':
  push:
    branches:
      - main
    paths:
      - 'Cloudflare-worker/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Cloudflare-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.86.0

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

          npx wrangler whoami

      - name: Check D1 migration history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list ebadsave-vsla-db --remote

      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply ebadsave-vsla-db --remote

      - name: Verify Worker secret bindings before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          echo "Checking secrets attached to ebadsave-vsla-cloudflare..."

          SECRETS="$(npx wrangler secret list --name ebadsave-vsla-cloudflare)"

          echo "$SECRETS"

          for SECRET in ADMIN_BOOTSTRAP_SECRET PIN_PEPPER JWT_HS256_SECRET; do
            if ! echo "$SECRETS" | grep -q "\"name\": \"$SECRET\""; then
              echo "ERROR: $SECRET is not attached to this Worker."
              exit 1
            fi
          done

          echo "All three Worker secrets are listed."

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy --name ebadsave-vsla-cloudflare

      - name: Verify Worker secret bindings after deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          npx wrangler secret list --name ebadsave-vsla-cloudflare

      - name: Verify Worker and D1 health
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(curl --fail --silent --show-error \
            https://ebadsave-vsla-cloudflare.info-ebadsave.workers.dev/health)"

          echo "$RESPONSE"

          node -e '
            const data = JSON.parse(process.argv[1]);

            const required = [
              "databaseConnected",
              "bootstrapSecretConfigured",
              "pinPepperConfigured",
              "jwtSecretConfigured"
            ];

            const failed = required.filter(key => data[key] !== true);

            if (
              data.ok !== true ||
              data.service !== "ebadsave-vsla-cloudflare" ||
              failed.length > 0
            ) {
              console.error(
                "ERROR: Worker readiness check failed:",
                failed.join(", ") || "service identity"
              );
              process.exit(1);
            }

            console.log("Worker, D1, and all secret bindings are ready.");
          ' "$RESPONSE"
